# 无反向代理场景：gateway 容器直连 SearXNG，remote_addr 即真实来源。
# 新 schema（2026.4+）：不配置 botdetection.trusted_proxies = 不信任 X-Forwarded-For
# （旧 real_ip.x_for = 0 的等价语义）；前缀配置移入 [botdetection]。
[botdetection]
ipv4_prefix = 32
ipv6_prefix = 48

[botdetection.ip_lists]
pass_ip = [
    "172.16.0.0/12",
    "10.0.0.0/8",
    "192.168.0.0/16",
]
