# prism-search 生产 nginx 配置（两台机器同一结构，仅「对端 IP」互为镜像）
#   192.0.2.160 上：对端 = 192.0.2.159（本文件默认，两处带 ← 标记；192.0.2.x 为 RFC 5737 文档保留段示例，部署时换成真实 IP）
#   192.0.2.159 上：把两处 192.0.2.159 全部换成 192.0.2.160
#
# 生效前一次性准备：
#   1) 两台互访 8081（关键前提）：
#        curl -s -m 3 http://<对端IP>:8081/health     # 期望 {"status":"ok"}
#      不通就开 firewalld / 云安全组（仅放行对端 IP 的 8081）
#   2) mkdir -p /opt/nginx/maintenance && 给部署用户写权限
#      mkdir -p /opt/logs/prism/prism-search/nginx && chown -R <worker用户> /opt/logs/prism/prism-search/nginx
#      （日志目录：access_log 带日期变量后，文件由 worker 进程逐条 open/close，
#        目录必须对 nginx worker 用户可写——以 nginx.conf 的 user 指令为准，通常是 nginx）
#   3) 无需配置 .env.prod：维护窗口常量（域名 / 标记路径 / 探测地址）全部内置在
#      deploy-prod.sh 的默认值里，NGINX_PEER_URL 需在部署侧显式配置（环境变量或 .env.prod）
#   4) nginx -t && systemctl reload nginx（改配置这一次需要 reload；
#      之后的部署开关只 touch/rm 标记文件，不再需要 reload）
#
# 故障/维护时接口的返回（本服务是接口，不返回 HTML 页面）：
#   - 本机 gateway 挂 → 自动转对端，调用方无感（对端返回正常业务 JSON）
#   - 部署中 → 维护标记把流量整体切对端，调用方无感
#   - 两台都挂 → 降级 JSON：HTTP 503 {"code":-32001,"message":"服务维护中，请稍后重试"}
#     （与 gateway 全局异常格式对齐；带 CORS 头，跨域调用方也能读到响应体）

# 本机优先，本机 gateway 失败/部署中自动转对端（nginx 被动健康检查：
# 连续 3 次失败后 30s 内不再试本机，直接走对端）
upstream prism_gw {
    server 127.0.0.1:8081 max_fails=3 fail_timeout=30s;
    server 192.0.2.159:8081 backup;              # ← 159 上改为 192.0.2.160（指对端 8081，勿指对端 80）
}
# 维护标记存在时，本机流量整体交给对端（部署期间用）
upstream prism_peer_only {
    server 192.0.2.159:8081;                     # ← 159 上改为 192.0.2.160
}

# 访问日志按天切分：从 $time_iso8601（本地时区）提取日期段拼进文件名，
# 产物形如 prism-search-access-2026-09-18.log。
# 变量路径的代价：每条日志 open/close 一次、access_log buffer 不可用——本服务量级可接受。
# error_log 路径不支持变量，保持固定文件名；如需按天切分要靠外部 logrotate。
map $time_iso8601 $prism_logdate {
    ~^(?<d>\d{4}-\d{2}-\d{2}) $d;
    default "unknown";
}

server {
    listen 80;
    server_name prism-search.web.internal;

    # 正常流量与「维护标记切对端」的流量分开记录：
    #   正常 → prism-search-access-<日期>.log
    #   转发 → prism-search-forward-<日期>.log（发布期间被标记整体切走的请求）
    access_log /opt/logs/prism/prism-search/nginx/prism-search-$prism_logtag-$prism_logdate.log;
    # error_log 路径不支持变量，固定文件名（按天切分需 logrotate）
    error_log  /opt/logs/prism/prism-search/nginx/prism-search-error.log;

    # 维护标记 = 本机流量整体切到对端。部署脚本只 touch/rm 这个文件：
    # nginx 对 if (-f ...) 每个请求 stat 一次，开关不需要 reload、不用 sudo。
    # if 里只能 set（安全用法）；proxy_pass 用变量选 upstream，不能写进 if 块。
    set $prism_backend prism_gw;
    set $prism_logtag access;
    if (-f /opt/nginx/maintenance/prism.flag) {
        set $prism_backend prism_peer_only;
        set $prism_logtag forward;
    }

    # 双故障兜底：两台 gateway 都失败 → 降级 JSON（不需要任何静态文件）。
    # 502/504 统一转为 503（对调用方语义 = 临时性可重试）；上游自己的 503 原样透传。
    # = 后必须显式带码：孤立的 = 会用替代资源的响应码（200），故障就被掩盖了。
    proxy_intercept_errors on;
    error_page 502 504 =503 @fallback;

    location / {
        proxy_pass http://$prism_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 默认 60s/300s：上游真挂时用户要干等一分钟才看到错误。
        # 本机连接是毫秒级，connect 3s 已很宽；搜索请求 ~6s，read 30s 留足余量，
        # 上游挂起时 30s 内落到降级响应/对端。
        proxy_connect_timeout 3s;
        proxy_read_timeout    30s;
        # 本机失败立即转对端；POST 不自动重试（防重复提交）
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # 降级响应：与 gateway 全局异常格式对齐（app/main.py 全局兜底是
    # {"code":-32000,"message":...}，-32001 = 服务维护中，JSON-RPC 保留区）。
    # 注意：这里 return 的 503 不在 error_page 列表（列表只有 502/504）→ 不会递归触发。
    location @fallback {
        internal;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;    # 跨域调用方也要能读到降级响应
        add_header Retry-After 30 always;
        add_header X-Degraded "gateway-unreachable" always;   # 监控据此区分降级与正常
        add_header X-Prism-Node "$hostname" always;           # 一眼看出响应来自哪台
        return 503 '{"code":-32001,"message":"服务维护中，请稍后重试"}';
    }
}
