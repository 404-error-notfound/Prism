[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prism"
version = "0.1.0"
description = "Self-hosted LLM web search MCP server — low-cost alternative to commercial search APIs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "starlette>=0.40.0",
    "httpx[http2]>=0.28.0",
    "redis>=5.2.0",
    "sse-starlette>=2.1.0",
    "mcp>=1.6.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.7.0",
    "trafilatura>=1.12.0",
    "readability-lxml>=0.8.1",
    "tldextract>=5.1.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "ddgs>=6.3.0",
    "apscheduler>=3.10.4",
    "elasticsearch[async]>=8.0",
    "prometheus-client>=0.21.0",
    "python-ulid>=3.0.0",
    "pytest>=9.0.3",
]

[project.optional-dependencies]
governance = [
    "simhash>=2.1.2",
    "datasketch>=1.6.5",
    "sentence-transformers>=3.3.0",
    "onnxruntime>=1.20.0",
    "python-whois>=0.9.5",
    "robotexclusionrulesparser>=1.7.1",
]
browser = [
    "crawl4ai>=0.4.0",
    "playwright>=1.49.0",
    "playwright-stealth>=1.0.6",
    "browserforge>=1.2.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx[http2]>=0.28.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
